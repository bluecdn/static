name: Deploy site to both origins

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SH_HOST }}" "${{ secrets.SV_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Shanghai (domestic origin)
        run: |
          rsync -az --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            site/ root@${{ secrets.SH_HOST }}:/www/sites/static.bluecdn.com/

      - name: Deploy to Silicon Valley (overseas origin)
        run: |
          rsync -az --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            site/ root@${{ secrets.SV_HOST }}:/www/sites/static.bluecdn.com/

      - name: Summary
        run: echo "Deployed site/ to Shanghai (${{ secrets.SH_HOST }}) and Silicon Valley (${{ secrets.SV_HOST }})"
