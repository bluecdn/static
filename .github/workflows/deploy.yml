name: Deploy site to origin

# static.bluecdn.com 目前是**单源站**:芬兰 Hetzner 机,前面由阿里云 ESA 做边缘加速。
# 历史上的上海(101.132.147.10)与硅谷(47.254.125.87)双源站已下线/改作他用,不要再往那两台推。
# 源站地址放在 secrets.ORIGIN_HOST(本仓库是 public,不在代码里写明 IP)。
#
# 需要的仓库 Secrets:
#   ORIGIN_HOST     — 源站地址(IP 或域名)
#   DEPLOY_SSH_KEY  — 部署私钥,对应公钥须已在源站 /root/.ssh/authorized_keys
# 可选:
#   ORIGIN_USER        — 登录用户,默认 root
#   ORIGIN_KNOWN_HOSTS — 源站 SSH 主机公钥(ssh-keyscan 的输出)。填了就做主机密钥固定,
#                        不填则回退到首次连接自动信任(TOFU)。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'manifest.json'
      - '*.png'
      - '*.ico'
      - '*.svg'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-static
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ORIGIN_USER: ${{ secrets.ORIGIN_USER || 'root' }}
      REMOTE_DIR: /www/sites/static.bluecdn.com/
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — 检查必需的 Secrets
        env:
          ORIGIN_HOST: ${{ secrets.ORIGIN_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$ORIGIN_HOST" ]    || { echo "::error::缺少仓库 Secret: ORIGIN_HOST";    missing=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::缺少仓库 Secret: DEPLOY_SSH_KEY"; missing=1; }
          [ "$missing" = 0 ] || {
            echo "在 Settings → Secrets and variables → Actions 里补齐后重试。"
            exit 1
          }

      - name: Setup SSH
        env:
          ORIGIN_HOST: ${{ secrets.ORIGIN_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ORIGIN_KNOWN_HOSTS: ${{ secrets.ORIGIN_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$ORIGIN_KNOWN_HOSTS" ]; then
            printf '%s\n' "$ORIGIN_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "STRICT=yes" >> "$GITHUB_ENV"
          else
            ssh-keyscan -H "$ORIGIN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::未配置 ORIGIN_KNOWN_HOSTS,本次使用首次连接自动信任(TOFU)。"
            echo "STRICT=accept-new" >> "$GITHUB_ENV"
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Preflight — 连通性与目标目录
        env:
          ORIGIN_HOST: ${{ secrets.ORIGIN_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=$STRICT -o ConnectTimeout=15 \
            "$ORIGIN_USER@$ORIGIN_HOST" \
            "test -d '$REMOTE_DIR' || { echo '::error::源站不存在目录 $REMOTE_DIR'; exit 1; }; echo '源站可达,目标目录存在'"

      # 白名单同步:只推根目录的页面/SEO/图标文件。
      # 无 --delete,且不含 fonts/ 与 libs/ —— 那两个目录(共约 20G)只在服务器上维护,绝不能被这里动到。
      - name: Deploy
        env:
          ORIGIN_HOST: ${{ secrets.ORIGIN_HOST }}
        run: |
          rsync -az --no-perms --no-owner --no-group --itemize-changes \
            --include='index.html' --include='llms.txt' --include='llms-full.txt' \
            --include='robots.txt' --include='sitemap.xml' --include='manifest.json' \
            --include='favicon.ico' --include='favicon.svg' \
            --include='favicon-16x16.png' --include='favicon-32x32.png' \
            --include='apple-touch-icon.png' \
            --include='android-chrome-192x192.png' --include='android-chrome-512x512.png' \
            --exclude='*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=$STRICT" \
            ./ "$ORIGIN_USER@$ORIGIN_HOST:$REMOTE_DIR"

      # rsync 以 root 写入,新文件会是 root 属主;Caddy 以 caddy 用户运行,统一改回 caddy。
      - name: 修正属主
        env:
          ORIGIN_HOST: ${{ secrets.ORIGIN_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=$STRICT \
            "$ORIGIN_USER@$ORIGIN_HOST" \
            "cd '$REMOTE_DIR' && chown caddy:caddy index.html llms.txt llms-full.txt robots.txt sitemap.xml manifest.json favicon.* apple-touch-icon.png android-chrome-*.png 2>/dev/null || true"

      # 直连源站校验(绕过 ESA 边缘缓存),确认这次推的内容真的落地了。
      - name: 校验源站
        env:
          ORIGIN_HOST: ${{ secrets.ORIGIN_HOST }}
        run: |
          fail=0
          for path in / /llms.txt /manifest.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              --resolve "static.bluecdn.com:443:$ORIGIN_HOST" \
              "https://static.bluecdn.com$path")
            echo "$path -> HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = 0 ] || { echo "::error::源站校验失败"; exit 1; }
          echo "源站校验通过。注意:阿里云 ESA 边缘缓存较久,页面更新后需在 ESA 控制台刷新缓存才会对外生效。"
